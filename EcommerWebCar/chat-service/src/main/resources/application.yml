server:
  port: 8085
  servlet:
    context-path: /chat

spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://root:123456@localhost:27017/chat-service?authSource=admin
      auto-index-creation: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/anhqui

app:
  services:
    identity:
      url: http://localhost:8081
    catalog:
      url: http://localhost:8082
    ordering:
      url: http://localhost:8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

idp:
  url: http://localhost:8180/realms/anhqui/protocol/openid-connect/token
  client-id: ecommer-app
  client-secret: 2anScggPiIAmbA5mW5SI5JnGZAcCVveo
