server:
  port: 8888

app:
  application:
    name: api-gateway
  api-prefix: /api/v1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=${app.api-prefix}/identity/**
          filters:
            - StripPrefix=2

        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=${app.api-prefix}/catalog/**
          filters:
            - StripPrefix=2

        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=${app.api-prefix}/chat/**
          filters:
            - StripPrefix=2

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=${app.api-prefix}/payment/**
          filters:
            - StripPrefix=2

        - id: ordering-service
          uri: lb://ordering-service
          predicates:
            - Path=${app.api-prefix}/ordering/**
          filters:
            - StripPrefix=2

        - id: cms-service
          uri: lb://cms-service
          predicates:
            - Path=${app.api-prefix}/cms/**
          filters:
            - StripPrefix=2

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=${app.api-prefix}/ai/**
          filters:
            - StripPrefix=3

