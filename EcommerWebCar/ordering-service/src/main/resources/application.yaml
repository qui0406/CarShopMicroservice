server:
  port: 8083
  servlet:
    context-path: /ordering

spring:
  application:
    name: ordering-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/ordering-ecommer-car}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://${PUBLIC_IP:localhost}:8180}/realms/anhqui

cloudinary:
  cloud-name: do43r8nr0
  api-key: 947875495844325
  api-secret: evQEPk5TbxIMpCWbbXl8sLMbo6A

idp:
  url: ${KEYCLOAK_URL:http://${PUBLIC_IP:localhost}:8180}
  client-id: ${KEYCLOAK_CLIENT_ID:ecommer-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:lVaXmGMg3bmpkAcDSvBcqhiu1QSEiUGG}

app:
  services:
    identity:
      url: ${IDENTITY_SERVICE_URL:http://${PUBLIC_IP:localhost}:8081}
    catalog:
      url: ${CATALOG_SERVICE_URL:http://${PUBLIC_IP:localhost}:8082}
    pay:
      url: ${PAYMENT_SERVICE_URL:http://${PUBLIC_IP:localhost}:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${PUBLIC_IP:localhost}:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}:${random.value}
    prefer-ip-address: true

logging:
  level:
    org.springframework.security.web: DEBUG
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
