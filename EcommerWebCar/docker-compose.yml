name: ecommerCar

services:
  # --- Infrastructure ---
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    networks:
      - car_network

  car_mysql:
    image: mysql:8.0
    container_name: car_mysql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: identity-ecommer-car
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      car_network:
        aliases:
          - car_mysql
          - mysql_db

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    platform: linux/amd64
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    restart: unless-stopped
    networks:
      - car_network

  rabbitmq:
    image: rabbitmq:3.12-management
    platform: linux/amd64
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: 123456
    networks:
      - car_network

  car_redis:
    image: redis:7.0-alpine
    platform: linux/amd64
    container_name: car_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass 12345678
    networks:
      - car_network

  # --- Core Services ---
  eureka-server:
    image: anhqui0406/ecommer-eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - car_network

  api-gateway:
    image: anhqui0406/ecommer-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - IDP_URL=http://keycloak:8080
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - eureka-server
    networks:
      - car_network

  # --- Microservices ---
  identity-service:
    image: anhqui0406/ecommer-identity-service:latest
    container_name: identity-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://car_mysql:3306/identity-ecommer-car?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      # Thêm các biến Jakarta để chắc chắn Hibernate nhận được
      - JAKARTA_PERSISTENCE_JDBC_URL=jdbc:mysql://car_mysql:3306/identity-ecommer-car?createDatabaseIfNotExist=true
      - JAKARTA_PERSISTENCE_JDBC_USER=root
      - JAKARTA_PERSISTENCE_JDBC_PASSWORD=12345678
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - IDP_URL=http://keycloak:8080
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      car_mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - car_network

  catalog-service:
    image: anhqui0406/ecommer-catalog-service:latest
    container_name: catalog-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://car_mysql:3306/catalog-ecommer-car?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - IDP_URL=http://keycloak:8080
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      car_mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - car_network

  ordering-service:
    image: anhqui0406/ecommer-ordering-service:latest
    container_name: ordering-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://car_mysql:3306/ordering-ecommer-car?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - JAKARTA_PERSISTENCE_JDBC_URL=jdbc:mysql://car_mysql:3306/ordering-ecommer-car?createDatabaseIfNotExist=true
      - JAKARTA_PERSISTENCE_JDBC_USER=root
      - JAKARTA_PERSISTENCE_JDBC_PASSWORD=12345678
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      car_mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - car_network

  payment-service:
    image: anhqui0406/ecommer-payment-service:latest
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://car_mysql:3306/payment-ecommer-car?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - JAKARTA_PERSISTENCE_JDBC_URL=jdbc:mysql://car_mysql:3306/payment-ecommer-car?createDatabaseIfNotExist=true
      - JAKARTA_PERSISTENCE_JDBC_USER=root
      - JAKARTA_PERSISTENCE_JDBC_PASSWORD=12345678
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      car_mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - car_network

  notification-service:
    image: anhqui0406/ecommer-notification-service:latest
    container_name: notification-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - car_network

  ai-service:
    image: anhqui0406/ecommer-ai-service:latest
    container_name: ai-service
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=car_mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=12345678
      - MYSQL_DB=catalog-ecommer-car
      - REDIS_URL=redis://car_redis:6379?protocol=2
    depends_on:
      car_mysql:
        condition: service_healthy
      car_redis:
        condition: service_started
    networks:
      - car_network

  chat-service:
    image: anhqui0406/ecommer-chat-service:latest
    container_name: chat-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/chat?authSource=admin
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mongodb
      - eureka-server
    networks:
      - car_network

  frontend:
    image: anhqui0406/ecommer-frontend:latest
    container_name: frontend
    ports:
      - "3000:80"
    restart: always
    networks:
      - car_network

volumes:
  redis_data:
  mysql_data:

networks:
  car_network:
    driver: bridge