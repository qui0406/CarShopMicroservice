name: CI/CD for CarShop Microservices

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          api-gateway,
          catalog-service,
          chat-service,
          eureka-server,
          identity-service,
          notification-service,
          ordering-service,
          payment-service,
          ai-service
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./EcommerWebCar/${{ matrix.service }}
          push: true
          tags: anhqui0406/ecommer-${{ matrix.service }}:latest
          platforms: linux/amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.1.245.236
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CarShopMicroservice/EcommerWebCar
            docker compose pull
            docker compose up -d
