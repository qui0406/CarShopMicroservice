name: CI/CD for CarShop Microservices

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [
          api-gateway,
          catalog-service,
          chat-service,
          eureka-server,
          identity-service,
          notification-service,
          ordering-service,
          payment-service
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./EcommerWebCar/${{ matrix.service }}
          push: true
          tags: anhqui0406/ecommer-${{ matrix.service }}:latest
          platforms: linux/amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 3.1.245.236
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "EcommerWebCar/docker-compose.yml"
          target: "/home/ubuntu/CarShopMicroservice/EcommerWebCar"
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.1.245.236
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            cd ~/CarShopMicroservice/EcommerWebCar
            
            # TỰ ĐỘNG TẠO FILE .ENV VỚI IP THẬT
            echo "PUBLIC_IP=3.1.245.236" > .env
            echo "KEYCLOAK_PORT=8180" >> .env
            echo "EUREKA_PORT=8761" >> .env
            echo "API_GATEWAY_PORT=8888" >> .env
            echo "FRONTEND_PORT=3000" >> .env
            echo "KEYCLOAK_URL=http://3.1.245.236:8180" >> .env
            echo "EUREKA_URL=http://3.1.245.236:8761/eureka/" >> .env
            echo "API_GATEWAY_URL=http://3.1.245.236:8888" >> .env
            echo "FRONTEND_URL=http://3.1.245.236:3000" >> .env
            echo "IDENTITY_SERVICE_URL=http://3.1.245.236:8081" >> .env
            echo "CATALOG_SERVICE_URL=http://3.1.245.236:8082" >> .env
            echo "ORDERING_SERVICE_URL=http://3.1.245.236:8083" >> .env
            echo "PAYMENT_SERVICE_URL=http://3.1.245.236:8084" >> .env

            docker system prune -af
            rm -rf cms-service
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose pull
              docker-compose up -d --force-recreate
            else
              docker compose pull
              docker compose up -d --force-recreate
            fi
