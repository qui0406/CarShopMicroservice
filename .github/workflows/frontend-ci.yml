name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'carecommerapp/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'carecommerapp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carecommerapp

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: carecommerapp/package-lock.json

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build --if-present

    - name: Build Docker Image
      run: docker build -t carecommerapp:latest .
