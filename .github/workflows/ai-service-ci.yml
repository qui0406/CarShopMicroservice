name: AI Service CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'EcommerWebCar/ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EcommerWebCar/ai-service

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Modify if you use a different Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build Docker Image
      run: |
        if [ -f Dockerfile ]; then
          docker build -t ai-service:latest .
        else
          echo "Skipping Docker build... No Dockerfile found"
        fi
